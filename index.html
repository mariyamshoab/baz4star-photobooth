    <div class="el screen" id="scr">
      <video id="cam" class="mirror" playsinline muted autoplay></video>
      <canvas id="vcan" class="live" hidden></canvas>
      <video id="playback" playsinline hidden></video>
      <div class="framebar" id="framebar">
        <div class="minibox"><span class="mlbl">pick a frame</span><div class="mrow"><button class="btn arrow" id="prevF" aria-label="Previous frame">‹</button><img id="mini" alt="Frame preview"><button class="btn arrow" id="nextF" aria-label="Next frame">›</button></div><span id="frameName">pink dots</span></div>
      </div>
      <div class="count" id="count" aria-live="assertive"></div>
      <div class="pill" id="pill" hidden></div>
      <div class="msg" id="msg" hidden></div>
      <div class="flash" id="flash"></div>
    </div>
    <div class="el switch fs24" id="sw"><span>b&amp;w</span><button class="toggle" role="switch" aria-checked="false" id="colourT" aria-label="Colour photos"></button><span>colour</span></div>
    <div class="el chips" id="chips" hidden></div>
    <div class="el golabel fs24" id="golbl">start</div>
    <button class="el gobtn" id="go" aria-label="Start taking photos"></button>
    <div class="el modeplate fs20" id="mode"><span>mode</span><div class="row"><button class="btn" id="mStrip">photo strip</button><button class="btn" id="mVideo">video note</button></div></div>
    <div class="el golabel fs24" id="slotlbl">your strip</div>
    <div class="el slot" id="slot"><div class="feed"><img id="stripImg" alt="Your printed photo strip"><div class="dev"></div></div></div>
    <div class="el hint fs20" id="hint">(empty for now — smile first!)</div>
    <div class="el" id="tray" hidden><svg viewBox="0 0 160 96" width="100%" aria-hidden="true"><g transform="rotate(-4 80 48)"><rect x="4" y="6" width="152" height="84" rx="10" fill="#FFFDF7" stroke="#2B2723" stroke-width="3"/><rect x="22" y="16" width="116" height="32" fill="#F5B3C7" stroke="#2B2723" stroke-width="2"/><text x="80" y="39" text-anchor="middle" font-family="Gochi Hand, cursive" font-size="20" fill="#2B2723">baz ♡ 0:10</text><circle cx="52" cy="66" r="12" fill="none" stroke="#2B2723" stroke-width="2.4"/><circle cx="108" cy="66" r="12" fill="none" stroke="#2B2723" stroke-width="2.4"/></g></svg></div>
    <div class="el actions" id="acts"></div>
  </div></div>
</section>

<section id="doodle" class="view" aria-label="Doodle on your strip" hidden>
  <nav class="topnav" aria-label="Main"><div class="grp"><a class="btn" href="#/">← outside</a></div><div class="grp"><a class="btn" href="#/wall">the wall</a><a class="btn" href="#/video">video notes</a><button class="btn sndT" aria-label="Sound">♪ on</button></div></nav>
  <div class="doodle">
    <h1>doodle on your strip</h1>
    <div class="rail sk">
      <div class="crayons" id="crayons"></div>
      <div class="sizes" id="sizes"></div>
      <div class="tools"><button class="btn" id="tErase">eraser</button><button class="btn" id="tText">text</button><button class="btn" id="tUndo">undo</button><button class="btn" id="tClear">clear</button></div>
    </div>
    <div class="desk">
      <div class="work" id="work">
        <img class="base" id="baseImg" alt="Your strip">
        <canvas id="drawC" aria-label="Drawing area"></canvas>
        <div class="itembar" id="itembar" hidden><button id="ibSmall" aria-label="Smaller">−</button><button id="ibBig" aria-label="Bigger">+</button><button id="ibTurn" aria-label="Turn">↻</button><button id="ibDel" aria-label="Remove">✕</button></div>
      </div>
    </div>
    <div class="side">
      <div class="sheet sk"><h2>sticker sheet</h2><div class="stk" id="stk"></div></div>
      <div class="card sk">
        <label><span class="lbl">signed,</span><input id="signName" maxlength="40" placeholder="your name"></label>
        <label><span class="lbl">a little note for baz</span><textarea id="signNote" maxlength="500" placeholder="happy birthday you star…"></textarea></label>
      </div>
      <div class="row-btns"><button class="btn big sh-pink on" id="pinBtn">pin it to the wall ★</button><button class="btn" id="dlBtn">download</button></div>
    </div>
  </div>
</section>

<section id="wall" class="view" aria-label="baz's wall" hidden>
  <nav class="topnav" aria-label="Main"><div class="grp"><a class="btn" href="#/">← outside</a></div><div class="grp"><button class="btn" id="ownerBtn">owner</button><a class="btn" href="#/wall">the wall</a><a class="btn" href="#/video">video notes</a><button class="btn sndT" aria-label="Sound">♪ on</button></div></nav>
  <div class="wallhead">
    <h1>baz's wall ♡</h1>
    <div class="feat"><span>featured on the booth:</span><button class="btn" id="mAuto">auto · newest</button><button class="btn" id="mPick">pick my own</button><span class="muted" id="featHint"></span></div>
  </div>
  <div class="board" id="board"></div>
</section>
</main>
<div id="modal" class="modal" hidden><div class="box" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="assets/supabase.js"></script>
<script type="module" src="app.js"></script>
</body>
